# Data Source
spring.datasource.driver-class-name = org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.url               = jdbc:tc:postgresql:16-alpine:///webshop_test

spring.shard1.datasource.url        = jdbc:tc:postgresql:16-alpine:///webshop_test
spring.shard1.datasource.username   = postgres
spring.shard1.datasource.password   = postgres


spring.shard2.datasource.url        = jdbc:tc:postgresql:16-alpine:///webshop_test
spring.shard2.datasource.username   = postgres
spring.shard2.datasource.password   = postgres


spring.data.rest.default-page-size  = 12

# JPA
spring.jpa.generate-ddl             = true
spring.jpa.hibernate.ddl-auto       = none
spring.jpa.show-sql                 = true


# App
spring.main.banner-mode             = off
server.port                         = 8080
app.storage.sizeLimit               = 5242880
